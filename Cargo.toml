[package]
name = "tokito-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline-first Rust tooling for Tokito board preparation"

[[bin]]
name = "tokito-cli"
path = "src/main.rs"

[dependencies]
earcut = "=0.4.11"
gltf = { version = "=1.4.1", default-features = false }
serde = "=1.0.229"
serde_json = "=1.0.151"
