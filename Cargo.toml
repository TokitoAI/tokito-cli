[package]
name = "tokito-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline-first Rust tooling for Tokito board preparation"

[[bin]]
name = "tokito-cli"
path = "src/main.rs"

[dependencies]
gix = { version = "=0.83.0", default-features = false, features = ["sha1", "zlib-rs"] }
earcut = "=0.4.11"
gltf = { version = "=1.4.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
